<div class="tui-stack tui-max-w-md">
  <div class="tui-progress tui-progress-success" role="progressbar" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100" aria-label="Success">
    <div class="tui-progress-bar" style="--tui-progress-value: 85"></div>
  </div>
  <div class="tui-progress tui-progress-warning" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" aria-label="Warning">
    <div class="tui-progress-bar" style="--tui-progress-value: 45"></div>
  </div>
  <div class="tui-progress tui-progress-error" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" aria-label="Error">
    <div class="tui-progress-bar" style="--tui-progress-value: 25"></div>
  </div>
  <div class="tui-progress tui-tone-info" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" aria-label="Info">
    <div class="tui-progress-bar" style="--tui-progress-value: 50"></div>
  </div>
</div>
