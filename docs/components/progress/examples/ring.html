<div class="tui-flex tui-flex-wrap tui-items-center tui-gap-6">
  <div class="tui-progress-ring" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" aria-label="Storage" style="--tui-progress-value: 75"></div>
  <div class="tui-progress-ring tui-progress-success" role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100" aria-label="Uptime" style="--tui-progress-value: 90"></div>
  <div class="tui-progress-ring tui-tone-neutral" role="progressbar" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100" aria-label="Small ring" style="--tui-progress-value: 30; --tui-progress-ring-size: 2.5rem"></div>
  <div class="tui-progress-ring tui-progress-error" role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" aria-label="Custom track" style="--tui-progress-value: 40; --tui-progress-ring-track: var(--tui-negative-soft)"></div>
