<div class="tui-composer tui-max-w-md">
  <div class="tui-composer-toolbar">
    <div class="tui-button-group">
      <button type="button" class="tui-button tui-button-ghost tui-button-sm" aria-label="Bold"><strong>B</strong></button>
      <button type="button" class="tui-button tui-button-ghost tui-button-sm" aria-label="Italic"><em>I</em></button>
    </div>
    <span class="tui-chip tui-chip-primary">Reply ▾</span>
  </div>
  <textarea class="tui-composer-input" rows="2" id="composer-basic-message" name="composer-basic-message" aria-label="Message" placeholder="Write a message…"></textarea>
  <div class="tui-composer-footer">
    <button type="button" class="tui-button tui-button-ghost tui-button-sm" aria-label="Attach a file">📎</button>
    <button type="button" class="tui-button tui-button-primary tui-button-sm">Send</button>
  </div>
</div>
