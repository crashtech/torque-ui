<div class="tui-flex tui-flex-wrap tui-gap-2 tui-items-center" id="buttons-pressed">
  <button class="tui-button" type="button" aria-pressed="true">Bold</button>
  <button class="tui-button" type="button" aria-pressed="false">Italic</button>
  <button class="tui-button tui-button-primary" type="button" aria-pressed="true">Pinned</button>
  <button class="tui-button" type="button" aria-expanded="false">More <span class="tui-caret"></span></button>
  <button class="tui-button tui-button-primary" type="button" aria-expanded="true">Options <span class="tui-caret"></span></button>
</div>
<script>
  document.querySelectorAll('#buttons-pressed [aria-pressed], #buttons-pressed [aria-expanded]').forEach((button) => {
    const attribute = button.hasAttribute('aria-pressed') ? 'aria-pressed' : 'aria-expanded';
    button.addEventListener('click', () => button.setAttribute(attribute, button.getAttribute(attribute) !== 'true'));
  });
</script>
