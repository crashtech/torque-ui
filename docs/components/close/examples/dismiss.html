<div class="tui-stack">
  <div class="tui-alert tui-alert-info">
    <p>An alert with the dismiss pair as its last two children.</p>
    <input class="tui-state-input tui-dismiss" type="checkbox" id="close-dismiss-alert">
    <label class="tui-close" for="close-dismiss-alert" aria-label="Dismiss"></label>
  </div>
  <div class="tui-flex tui-flex-wrap tui-gap-2">
    <span class="tui-chip tui-chip-primary">
      A chip
      <input class="tui-state-input tui-dismiss" type="checkbox" id="close-dismiss-chip">
      <label class="tui-close" for="close-dismiss-chip" aria-label="Remove"></label>
    </span>
  </div>
</div>
