<div class="tui-form-grid tui-max-w-lg">
  <div class="tui-field">
    <label for="inputs-tones-primary">Primary</label>
    <input id="inputs-tones-primary" class="tui-input-primary" type="text" placeholder="Primary border">
  </div>
  <div class="tui-field">
    <label for="inputs-tones-success">Success</label>
    <input id="inputs-tones-success" class="tui-input-success" type="text" value="Looks good">
  </div>
  <div class="tui-field">
    <label for="inputs-tones-error">Error</label>
    <input id="inputs-tones-error" class="tui-input-error" type="text" value="Bad data">
  </div>
  <div class="tui-field">
    <label for="inputs-tones-warning">Warning</label>
    <input id="inputs-tones-warning" class="tui-input-warning" type="text" placeholder="Check this">
  </div>
  <div class="tui-field">
    <label for="inputs-tones-info">Info</label>
    <input id="inputs-tones-info" class="tui-input-info" type="text" placeholder="Optional">
  </div>
</div>
