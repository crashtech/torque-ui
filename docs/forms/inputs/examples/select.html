<div class="tui-form-grid tui-max-w-lg">
  <div class="tui-field">
    <label for="inputs-select-plan">Plan</label>
    <select id="inputs-select-plan">
      <option>Prototype</option>
      <option>Team</option>
      <option>Enterprise</option>
    </select>
  </div>
  <div class="tui-field">
    <label for="inputs-select-lang">Language</label>
    <input id="inputs-select-lang" type="text" list="inputs-select-langs" placeholder="Start typing">
    <datalist id="inputs-select-langs">
      <option value="CSS"></option>
      <option value="HTML"></option>
      <option value="JavaScript"></option>
    </datalist>
  </div>
</div>
