<div class="tui-stack tui-max-w-sm">
  <div class="tui-field">
    <label for="inputs-basic-text">Text</label>
    <input id="inputs-basic-text" type="text" placeholder="Enter text">
  </div>
  <div class="tui-field">
    <label for="inputs-basic-email">Email</label>
    <input id="inputs-basic-email" type="email" placeholder="you@example.com">
  </div>
  <div class="tui-field">
    <label for="inputs-basic-textarea">Message</label>
    <textarea id="inputs-basic-textarea" rows="3" placeholder="Write your message"></textarea>
  </div>
  <div class="tui-field">
    <label for="inputs-basic-disabled">Disabled</label>
    <input id="inputs-basic-disabled" type="text" value="Cannot edit" disabled>
  </div>
</div>
