<form class="tui-form tui-max-w-sm" action="#" method="get">
  <div class="tui-field">
    <label for="validation-required-name">Name (required)</label>
    <input id="validation-required-name" type="text" required placeholder="Leave empty and tab away">
  </div>
  <div class="tui-field">
    <label for="validation-required-email">Email</label>
    <input id="validation-required-email" type="email" required placeholder="Type something that is not an address">
  </div>
  <div class="tui-field">
    <label for="validation-required-seats">Seats (1 to 100)</label>
    <input id="validation-required-seats" type="number" min="1" max="100" required placeholder="Try 250">
  </div>
</form>
