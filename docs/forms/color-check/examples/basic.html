<div class="tui-color-check-group">
  <label class="tui-color-check" for="color-check-basic-indigo" title="Indigo">
    <input class="tui-color-check-input" type="radio" id="color-check-basic-indigo" name="color-check-basic" value="indigo" checked>
    <span class="tui-color-check-swatch" style="--tui-swatch: #6366f1;"></span>
  </label>
  <label class="tui-color-check" for="color-check-basic-teal" title="Teal">
    <input class="tui-color-check-input" type="radio" id="color-check-basic-teal" name="color-check-basic" value="teal">
    <span class="tui-color-check-swatch" style="--tui-swatch: #14b8a6;"></span>
  </label>
  <label class="tui-color-check" for="color-check-basic-rose" title="Rose">
    <input class="tui-color-check-input" type="radio" id="color-check-basic-rose" name="color-check-basic" value="rose">
    <span class="tui-color-check-swatch" style="--tui-swatch: #f43f5e;"></span>
  </label>
  <label class="tui-color-check" for="color-check-basic-amber" title="Amber">
    <input class="tui-color-check-input" type="radio" id="color-check-basic-amber" name="color-check-basic" value="amber">
    <span class="tui-color-check-swatch" style="--tui-swatch: #f59e0b;"></span>
  </label>
  <label class="tui-color-check" for="color-check-basic-default" title="Default">
    <input class="tui-color-check-input" type="radio" id="color-check-basic-default" name="color-check-basic" value="default">
    <span class="tui-color-check-swatch"></span>
  </label>
</div>
