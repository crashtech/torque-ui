<fieldset>
  <legend>Label colour</legend>
  <div class="tui-color-check-group">
    <label class="tui-color-check" for="color-check-labelled-brand">
      <input class="tui-color-check-input" type="radio" id="color-check-labelled-brand" name="color-check-labelled" value="brand" checked>
      <span class="tui-color-check-swatch" style="--tui-swatch: var(--tui-brand);"></span>
      <span class="tui-sr-only">Brand</span>
    </label>
    <label class="tui-color-check" for="color-check-labelled-positive">
      <input class="tui-color-check-input" type="radio" id="color-check-labelled-positive" name="color-check-labelled" value="positive">
      <span class="tui-color-check-swatch" style="--tui-swatch: var(--tui-positive);"></span>
      <span class="tui-sr-only">Positive</span>
    </label>
    <label class="tui-color-check" for="color-check-labelled-warning">
      <input class="tui-color-check-input" type="radio" id="color-check-labelled-warning" name="color-check-labelled" value="warning">
      <span class="tui-color-check-swatch" style="--tui-swatch: var(--tui-warning);"></span>
      <span class="tui-sr-only">Warning</span>
    </label>
    <label class="tui-color-check" for="color-check-labelled-negative">
      <input class="tui-color-check-input" type="radio" id="color-check-labelled-negative" name="color-check-labelled" value="negative">
      <span class="tui-color-check-swatch" style="--tui-swatch: var(--tui-negative);"></span>
      <span class="tui-sr-only">Negative</span>
    </label>
  </div>
</fieldset>
