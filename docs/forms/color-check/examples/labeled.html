<fieldset>
  <legend>Label color</legend>
  <div class="tui-color-check-group">
    <label class="tui-color-check" for="color-check-labeled-brand">
      <input class="tui-color-check-input" type="radio" id="color-check-labeled-brand" name="color-check-labeled" value="brand" checked>
      <span class="tui-color-check-swatch" style="--tui-swatch: var(--tui-brand);"></span>
      <span class="tui-sr-only">Brand</span>
    </label>
    <label class="tui-color-check" for="color-check-labeled-positive">
      <input class="tui-color-check-input" type="radio" id="color-check-labeled-positive" name="color-check-labeled" value="positive">
      <span class="tui-color-check-swatch" style="--tui-swatch: var(--tui-positive);"></span>
      <span class="tui-sr-only">Positive</span>
    </label>
    <label class="tui-color-check" for="color-check-labeled-warning">
      <input class="tui-color-check-input" type="radio" id="color-check-labeled-warning" name="color-check-labeled" value="warning">
      <span class="tui-color-check-swatch" style="--tui-swatch: var(--tui-warning);"></span>
      <span class="tui-sr-only">Warning</span>
    </label>
    <label class="tui-color-check" for="color-check-labeled-negative">
      <input class="tui-color-check-input" type="radio" id="color-check-labeled-negative" name="color-check-labeled" value="negative">
      <span class="tui-color-check-swatch" style="--tui-swatch: var(--tui-negative);"></span>
      <span class="tui-sr-only">Negative</span>
    </label>
  </div>
</fieldset>
