<div class="tui-stack tui-max-w-sm">
  <div class="tui-field">
    <label for="input-group-trailing-domain">Subdomain</label>
    <div class="tui-input-group">
      <input id="input-group-trailing-domain" type="text" placeholder="yoursite">
      <span class="tui-input-addon">.example.com</span>
    </div>
  </div>
  <div class="tui-field">
    <label for="input-group-trailing-weight">Weight</label>
    <div class="tui-input-group" style="--tui-input-group-radius: var(--tui-radius-full);">
      <span class="tui-input-addon">≈</span>
      <input id="input-group-trailing-weight" type="number" min="0" placeholder="0">
      <span class="tui-input-addon">kg</span>
    </div>
  </div>
</div>
