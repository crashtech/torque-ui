<form class="tui-form-grid" action="#" method="get">
  <div class="tui-field">
    <label for="form-layout-grid-first">First name</label>
    <input id="form-layout-grid-first" name="first" type="text" placeholder="First name">
  </div>
  <div class="tui-field">
    <label for="form-layout-grid-last">Last name</label>
    <input id="form-layout-grid-last" name="last" type="text" placeholder="Last name">
  </div>
  <div class="tui-field">
    <label for="form-layout-grid-email">Email</label>
    <input id="form-layout-grid-email" name="email" type="email" placeholder="you@example.com">
  </div>
  <div class="tui-field">
    <label for="form-layout-grid-phone">Phone</label>
    <input id="form-layout-grid-phone" name="phone" type="tel" placeholder="+44 20 7946 0000">
  </div>
</form>
