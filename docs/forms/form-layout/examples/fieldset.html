<form class="tui-form tui-max-w-md" action="#" method="get">
  <fieldset>
    <legend>Shipping address</legend>
    <div class="tui-field">
      <label for="form-layout-fieldset-street">Street</label>
      <input id="form-layout-fieldset-street" name="street" type="text" placeholder="123 Main St">
    </div>
    <div class="tui-field">
      <label for="form-layout-fieldset-city">City</label>
      <input id="form-layout-fieldset-city" name="city" type="text" placeholder="Springfield">
    </div>
  </fieldset>
  <fieldset>
    <legend>Notify me by</legend>
    <div class="tui-fieldset-inline">
      <label class="tui-checkbox"><input class="tui-checkbox-input" type="checkbox" name="notify" value="email" checked><span>Email</span></label>
      <label class="tui-checkbox"><input class="tui-checkbox-input" type="checkbox" name="notify" value="sms"><span>SMS</span></label>
      <label class="tui-checkbox"><input class="tui-checkbox-input" type="checkbox" name="notify" value="push"><span>Push</span></label>
    </div>
  </fieldset>
</form>
