<form class="tui-form tui-max-w-sm" action="#" method="get">
  <div class="tui-field">
    <label for="form-layout-stacked-name">Full name</label>
    <input id="form-layout-stacked-name" name="name" type="text" placeholder="Enter your name">
  </div>
  <div class="tui-field">
    <label for="form-layout-stacked-email">Email</label>
    <input id="form-layout-stacked-email" name="email" type="email" placeholder="you@example.com">
  </div>
  <div class="tui-field">
    <label for="form-layout-stacked-message">Message</label>
    <textarea id="form-layout-stacked-message" name="message" rows="3" placeholder="Write your message"></textarea>
  </div>
  <input type="hidden" name="source" value="docs">
  <button class="tui-button tui-button-primary" type="button">Send</button>
</form>
