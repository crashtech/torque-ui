<form class="tui-form-inline" action="#" method="get">
  <div class="tui-field-inline">
    <label for="form-layout-inline-query">Query</label>
    <input id="form-layout-inline-query" name="q" type="search" placeholder="Invoices">
  </div>
  <div class="tui-field-inline">
    <label for="form-layout-inline-status">Status</label>
    <select id="form-layout-inline-status" name="status">
      <option>Any</option>
      <option>Paid</option>
      <option>Overdue</option>
    </select>
  </div>
  <button class="tui-button" type="button">Filter</button>
</form>
