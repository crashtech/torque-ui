<div class="tui-checkbox-group tui-checkbox-group-inline">
  <label class="tui-checkbox" for="checkbox-tones-brand">
    <input class="tui-checkbox-input" type="checkbox" id="checkbox-tones-brand" checked>
    <span>Brand</span>
  </label>
  <label class="tui-checkbox tui-checkbox-success" for="checkbox-tones-success">
    <input class="tui-checkbox-input" type="checkbox" id="checkbox-tones-success" checked>
    <span>Success</span>
  </label>
  <label class="tui-checkbox tui-tone-warning" for="checkbox-tones-warning">
    <input class="tui-checkbox-input" type="checkbox" id="checkbox-tones-warning" checked>
    <span>Warning</span>
  </label>
  <label class="tui-checkbox tui-tone-error" for="checkbox-tones-error">
    <input class="tui-checkbox-input" type="checkbox" id="checkbox-tones-error" checked>
    <span>Error</span>
  </label>
</div>
