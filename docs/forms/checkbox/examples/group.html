<div class="tui-checkbox-group">
  <label class="tui-checkbox" for="checkbox-group-email">
    <input class="tui-checkbox-input" type="checkbox" id="checkbox-group-email" name="checkbox-group-notify" value="email" checked>
    <span>Email me about new releases</span>
  </label>
  <label class="tui-checkbox" for="checkbox-group-digest">
    <input class="tui-checkbox-input" type="checkbox" id="checkbox-group-digest" name="checkbox-group-notify" value="digest">
    <span>Send a weekly digest</span>
  </label>
  <label class="tui-checkbox" for="checkbox-group-security">
    <input class="tui-checkbox-input" type="checkbox" id="checkbox-group-security" name="checkbox-group-notify" value="security" checked>
    <span>Security alerts</span>
  </label>
</div>
