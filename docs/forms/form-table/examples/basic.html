<table class="tui-form-table">
  <tbody>
    <tr>
      <th scope="row"><label for="form-table-basic-name">Workspace name</label></th>
      <td><input id="form-table-basic-name" type="text" value="Torby"></td>
    </tr>
    <tr>
      <th scope="row"><label for="form-table-basic-plan">Plan</label></th>
      <td>
        <select id="form-table-basic-plan">
          <option>Prototype</option>
          <option selected>Team</option>
          <option>Enterprise</option>
        </select>
      </td>
    </tr>
    <tr>
      <th scope="row"><label for="form-table-basic-public">Public profile</label></th>
      <td>
        <label class="tui-switch" for="form-table-basic-public">
          <input class="tui-switch-input" type="checkbox" id="form-table-basic-public" checked>
          <span class="tui-switch-label">Visible to everyone</span>
        </label>
      </td>
    </tr>
  </tbody>
</table>
