<div class="tui-field-inline">
  <label for="stepper-basic-qty">Quantity</label>
  <div class="tui-stepper">
    <button class="tui-stepper-btn" type="button" aria-label="Decrease quantity">&minus;</button>
    <input class="tui-stepper-input" type="number" id="stepper-basic-qty" value="2" min="0" max="99">
    <button class="tui-stepper-btn" type="button" aria-label="Increase quantity">+</button>
  </div>
</div>
