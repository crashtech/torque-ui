<div class="tui-flex tui-flex-wrap tui-gap-4">
  <label class="tui-switch" for="switch-tones-brand">
    <input class="tui-switch-input" type="checkbox" id="switch-tones-brand" checked>
    <span class="tui-switch-label">Brand</span>
  </label>
  <label class="tui-switch tui-tone-success" for="switch-tones-success">
    <input class="tui-switch-input" type="checkbox" id="switch-tones-success" checked>
    <span class="tui-switch-label">Success</span>
  </label>
  <label class="tui-switch tui-tone-warning" for="switch-tones-warning">
    <input class="tui-switch-input" type="checkbox" id="switch-tones-warning" checked>
    <span class="tui-switch-label">Warning</span>
  </label>
  <label class="tui-switch tui-tone-error" for="switch-tones-error">
    <input class="tui-switch-input" type="checkbox" id="switch-tones-error" checked>
    <span class="tui-switch-label">Error</span>
  </label>
</div>
