<form class="tui-form tui-max-w-sm" action="#" method="get">
  <div class="tui-field">
    <label for="password-in-field-email">Email</label>
    <input id="password-in-field-email" type="email" autocomplete="username" placeholder="you@example.com">
  </div>
  <div class="tui-field">
    <label for="password-in-field-password">Password</label>
    <div class="tui-password">
      <input id="password-in-field-password" type="text" autocomplete="current-password" class="tui-password-input" placeholder="At least 12 characters">
      <input class="tui-state-input tui-password-toggle" type="checkbox" id="password-in-field-toggle">
      <label class="tui-button tui-button-ghost tui-button-icon tui-password-label" for="password-in-field-toggle" title="Show password"><svg class="tui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="tui-sr-only">Show password</span></label>
    </div>
    <span class="tui-help">Use a passphrase you do not reuse elsewhere.</span>
  </div>
  <button class="tui-button tui-button-primary" type="button">Sign in</button>
</form>
