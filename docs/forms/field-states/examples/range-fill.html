<div class="tui-stack tui-max-w-sm">
  <div class="tui-field">
    <label for="field-states-range-fill-brightness">Brightness</label>
    <input id="field-states-range-fill-brightness" class="tui-range-fill" type="range" min="0" max="100" value="70" style="--tui-range-value: 70%;">
  </div>
  <div class="tui-field">
    <label for="field-states-range-fill-volume">Volume</label>
    <input id="field-states-range-fill-volume" class="tui-range-fill" type="range" min="0" max="100" value="25" style="--tui-range-value: 25%;">
  </div>
</div>
