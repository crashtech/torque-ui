<div class="tui-radio-group tui-radio-group-inline">
  <label class="tui-radio" for="radio-tones-brand">
    <input class="tui-radio-input" type="radio" id="radio-tones-brand" name="radio-tones-brand" checked>
    <span>Brand</span>
  </label>
  <label class="tui-radio tui-radio-success" for="radio-tones-success">
    <input class="tui-radio-input" type="radio" id="radio-tones-success" name="radio-tones-success" checked>
    <span>Success</span>
  </label>
  <label class="tui-radio tui-tone-warning" for="radio-tones-warning">
    <input class="tui-radio-input" type="radio" id="radio-tones-warning" name="radio-tones-warning" checked>
    <span>Warning</span>
  </label>
  <label class="tui-radio tui-tone-error" for="radio-tones-error">
    <input class="tui-radio-input" type="radio" id="radio-tones-error" name="radio-tones-error" checked>
    <span>Error</span>
  </label>
</div>
