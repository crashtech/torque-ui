<div class="tui-radio-group tui-radio-group-inline">
  <label class="tui-radio tui-radio-inline" for="radio-inline-red">
    <input class="tui-radio-input" type="radio" id="radio-inline-red" name="radio-inline-color" value="red" checked>
    <span>Red</span>
  </label>
  <label class="tui-radio tui-radio-inline" for="radio-inline-green">
    <input class="tui-radio-input" type="radio" id="radio-inline-green" name="radio-inline-color" value="green">
    <span>Green</span>
  </label>
  <label class="tui-radio tui-radio-inline" for="radio-inline-blue">
    <input class="tui-radio-input" type="radio" id="radio-inline-blue" name="radio-inline-color" value="blue">
    <span>Blue</span>
  </label>
</div>
