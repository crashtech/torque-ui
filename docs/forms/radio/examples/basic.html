<div class="tui-flex tui-flex-wrap tui-gap-4">
  <label class="tui-radio" for="radio-basic-yes">
    <input class="tui-radio-input" type="radio" id="radio-basic-yes" name="radio-basic" value="yes" checked>
    <span>Selected</span>
  </label>
  <label class="tui-radio" for="radio-basic-no">
    <input class="tui-radio-input" type="radio" id="radio-basic-no" name="radio-basic" value="no">
    <span>Not selected</span>
  </label>
</div>
