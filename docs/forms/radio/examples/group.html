<div class="tui-radio-group">
  <label class="tui-radio" for="radio-group-free">
    <input class="tui-radio-input" type="radio" id="radio-group-free" name="radio-group-plan" value="free" checked>
    <span>Free plan</span>
  </label>
  <label class="tui-radio" for="radio-group-pro">
    <input class="tui-radio-input" type="radio" id="radio-group-pro" name="radio-group-plan" value="pro">
    <span>Pro plan</span>
  </label>
  <label class="tui-radio" for="radio-group-enterprise">
    <input class="tui-radio-input" type="radio" id="radio-group-enterprise" name="radio-group-plan" value="enterprise">
    <span>Enterprise plan</span>
  </label>
</div>
