<div class="tui-stack tui-p-3">
  <form class="tui-field tui-max-w-sm" id="customize-motion">
    <label for="customize-duration">Normal duration <output for="customize-duration">250</output>ms</label>
    <input id="customize-duration" name="duration" type="range" min="0" max="1500" step="50" value="250">
  </form>
  <div class="tui-flex tui-flex-wrap tui-gap-4 tui-items-center">
    <span class="tui-spinner" role="status" aria-label="Loading" id="customize-motion-spinner"></span>
    <span class="tui-badge tui-badge-primary tui-animate tui-animate-pulse tui-animate-loop">Pulse</span>    <label class="tui-switch" for="customize-motion-switch">
      <input class="tui-switch-input" type="checkbox" id="customize-motion-switch">
      <span class="tui-switch-label">Flip me</span>
    </label>
  </div>
  <div class="tui-progress tui-progress-loading tui-max-w-sm" role="progressbar" aria-label="Upload" aria-valuenow="60">
    <div class="tui-progress-bar" style="--tui-progress-value: 60"></div>
  </div>
</div>
<script>
  {
    const form = document.getElementById('customize-motion');
    form.addEventListener('input', () => {
      const { duration } = form.elements;
      document.documentElement.style.setProperty('--tui-duration-normal', `${duration.value}ms`);
      form.querySelector('output').value = duration.value;
    });
  }
</script>
