<dl class="tui-max-w-md">
  <dt><code>color-mix()</code></dt>
  <dd>Mixes two colours in a given colour space; the whole palette is derived with it.</dd>
  <dt><code>:has()</code></dt>
  <dd>The parent selector, matching an element by what it contains.</dd>
  <dt><code>@layer</code></dt>
  <dd>Declares a cascade layer so precedence never depends on specificity.</dd>
</dl>
