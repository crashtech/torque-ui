<p class="tui-max-w-md">Definitions use a <a href="#links-shapes-1" class="tui-link-dotted">dotted underline</a>, drafts a <a href="#links-shapes-2" class="tui-link-dashed">dashed one</a>, corrections a <a href="#links-shapes-3" class="tui-link-wavy">wavy one</a>, and a <a href="#links-shapes-4" class="tui-link-double">double underline</a> is for emphasis. A <a href="#links-shapes-5" class="tui-link-underline">plain underline</a> stays on at rest.</p>
