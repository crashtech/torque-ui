<fieldset class="tui-toggle-group tui-toggle-group-sm">
  <legend class="tui-sr-only">Period</legend>
  <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-small-day" name="toggle-group-small" value="day"><label class="tui-toggle" for="toggle-group-small-day">1D</label>
  <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-small-week" name="toggle-group-small" value="week" checked><label class="tui-toggle" for="toggle-group-small-week">1W</label>
  <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-small-month" name="toggle-group-small" value="month"><label class="tui-toggle" for="toggle-group-small-month">1M</label>
  <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-small-year" name="toggle-group-small" value="year"><label class="tui-toggle" for="toggle-group-small-year">1Y</label>
</fieldset>
