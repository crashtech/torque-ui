<fieldset class="tui-toggle-group">
  <legend class="tui-sr-only">Formatting</legend>
  <input class="tui-state-input tui-toggle-input" type="checkbox" id="toggle-group-checkbox-bold" name="toggle-group-checkbox" value="bold" checked><label class="tui-toggle" for="toggle-group-checkbox-bold"><strong>Bold</strong></label>
  <input class="tui-state-input tui-toggle-input" type="checkbox" id="toggle-group-checkbox-italic" name="toggle-group-checkbox" value="italic"><label class="tui-toggle" for="toggle-group-checkbox-italic"><em>Italic</em></label>
  <input class="tui-state-input tui-toggle-input" type="checkbox" id="toggle-group-checkbox-underline" name="toggle-group-checkbox" value="underline"><label class="tui-toggle" for="toggle-group-checkbox-underline"><u>Underline</u></label>
</fieldset>
