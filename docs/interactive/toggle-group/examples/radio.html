<fieldset class="tui-toggle-group">
  <legend class="tui-sr-only">Alignment</legend>
  <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-radio-left" name="toggle-group-radio" value="left" checked><label class="tui-toggle" for="toggle-group-radio-left">Left</label>
  <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-radio-center" name="toggle-group-radio" value="center"><label class="tui-toggle" for="toggle-group-radio-center">Center</label>
  <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-radio-right" name="toggle-group-radio" value="right"><label class="tui-toggle" for="toggle-group-radio-right">Right</label>
</fieldset>
