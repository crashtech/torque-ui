<div class="tui-max-w-xs">
  <fieldset class="tui-toggle-group tui-toggle-group-wrap">
    <legend class="tui-sr-only">Weekdays</legend>
    <input class="tui-state-input tui-toggle-input" type="checkbox" id="toggle-group-wrap-mon" name="toggle-group-wrap" value="mon" checked><label class="tui-toggle" for="toggle-group-wrap-mon">Monday</label>
    <input class="tui-state-input tui-toggle-input" type="checkbox" id="toggle-group-wrap-tue" name="toggle-group-wrap" value="tue" checked><label class="tui-toggle" for="toggle-group-wrap-tue">Tuesday</label>
    <input class="tui-state-input tui-toggle-input" type="checkbox" id="toggle-group-wrap-wed" name="toggle-group-wrap" value="wed"><label class="tui-toggle" for="toggle-group-wrap-wed">Wednesday</label>
    <input class="tui-state-input tui-toggle-input" type="checkbox" id="toggle-group-wrap-thu" name="toggle-group-wrap" value="thu"><label class="tui-toggle" for="toggle-group-wrap-thu">Thursday</label>
    <input class="tui-state-input tui-toggle-input" type="checkbox" id="toggle-group-wrap-fri" name="toggle-group-wrap" value="fri" checked><label class="tui-toggle" for="toggle-group-wrap-fri">Friday</label>
  </fieldset>
</div>
