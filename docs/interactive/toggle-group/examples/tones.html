<div class="tui-flex tui-flex-wrap tui-gap-4">
  <fieldset class="tui-toggle-group">
    <legend class="tui-sr-only">Sync state</legend>
    <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-tones-on" name="toggle-group-tones-sync" value="on" checked><label class="tui-toggle tui-toggle-success" for="toggle-group-tones-on">Syncing</label>
    <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-tones-wait" name="toggle-group-tones-sync" value="wait"><label class="tui-toggle tui-toggle-neutral" for="toggle-group-tones-wait">Waiting</label>
    <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-tones-off" name="toggle-group-tones-sync" value="off"><label class="tui-toggle tui-toggle-error" for="toggle-group-tones-off">Excluded</label>
  </fieldset>
  <fieldset class="tui-toggle-group">
    <legend class="tui-sr-only">Severity</legend>
    <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-tones-low" name="toggle-group-tones-severity" value="low"><label class="tui-toggle" for="toggle-group-tones-low">Low</label>
    <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-tones-medium" name="toggle-group-tones-severity" value="medium" checked><label class="tui-toggle tui-toggle-warning" for="toggle-group-tones-medium">Medium</label>
    <input class="tui-state-input tui-toggle-input" type="radio" id="toggle-group-tones-high" name="toggle-group-tones-severity" value="high"><label class="tui-toggle tui-toggle-error" for="toggle-group-tones-high">High</label>
  </fieldset>
</div>
