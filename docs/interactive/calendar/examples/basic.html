<div class="tui-calendar" role="group" aria-labelledby="calendar-basic-title" id="calendar-basic">
  <div class="tui-calendar-header">
    <button class="tui-button tui-button-ghost tui-button-icon" type="button" aria-label="Previous month">‹</button>
    <h3 class="tui-calendar-title" id="calendar-basic-title">September 2026</h3>
    <button class="tui-button tui-button-ghost tui-button-icon" type="button" aria-label="Next month">›</button>
  </div>
  <table class="tui-calendar-grid" role="grid" aria-labelledby="calendar-basic-title">
    <thead><tr><th abbr="Monday">Mo</th><th abbr="Tuesday">Tu</th><th abbr="Wednesday">We</th><th abbr="Thursday">Th</th><th abbr="Friday">Fr</th><th abbr="Saturday">Sa</th><th abbr="Sunday">Su</th></tr></thead>
    <tbody>
      <tr><td><button class="tui-calendar-day" type="button" data-outside>31</button></td><td><button class="tui-calendar-day" type="button">1</button></td><td><button class="tui-calendar-day" type="button">2</button></td><td><button class="tui-calendar-day" type="button" aria-current="date">3</button></td><td><button class="tui-calendar-day" type="button">4</button></td><td><button class="tui-calendar-day" type="button">5</button></td><td><button class="tui-calendar-day" type="button">6</button></td></tr>
      <tr><td><button class="tui-calendar-day" type="button">7</button></td><td><button class="tui-calendar-day" type="button">8</button></td><td><button class="tui-calendar-day" type="button" aria-selected="true">9</button></td><td><button class="tui-calendar-day" type="button">10</button></td><td><button class="tui-calendar-day" type="button">11</button></td><td><button class="tui-calendar-day" type="button">12</button></td><td><button class="tui-calendar-day" type="button">13</button></td></tr>
      <tr><td><button class="tui-calendar-day" type="button">14</button></td><td><button class="tui-calendar-day" type="button">15</button></td><td><button class="tui-calendar-day" type="button" disabled>16</button></td><td><button class="tui-calendar-day" type="button">17</button></td><td><button class="tui-calendar-day" type="button">18</button></td><td><button class="tui-calendar-day" type="button">19</button></td><td><button class="tui-calendar-day" type="button">20</button></td></tr>
    </tbody>
  </table>
</div>
<script>
  const calendar = document.getElementById('calendar-basic');
  const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const title = calendar.querySelector('.tui-calendar-title');
  calendar.addEventListener('click', (event) => {
    const day = event.target.closest('.tui-calendar-day');
    if (day && !day.disabled) calendar.querySelectorAll('.tui-calendar-day').forEach((other) => other.setAttribute('aria-selected', other === day));
  });
  calendar.querySelectorAll('.tui-calendar-header button').forEach((button, direction) => button.addEventListener('click', () => {
    // why: the demo only turns the title; a real picker re-renders the cells for the new month
    const [month, year] = title.textContent.split(' ');
    const index = months.indexOf(month) + (direction ? 1 : -1);
    title.textContent = `${months[(index + 12) % 12]} ${Number(year) + Math.floor(index / 12)}`;
  }));
</script>
