<fieldset class="tui-rating">
  <legend class="tui-sr-only">Rate this article</legend>
  <input class="tui-state-input tui-rating-input" type="radio" name="rating-stars" id="rating-stars-1" value="1"><label class="tui-rating-star" for="rating-stars-1" aria-label="1 star">★</label>
  <input class="tui-state-input tui-rating-input" type="radio" name="rating-stars" id="rating-stars-2" value="2"><label class="tui-rating-star" for="rating-stars-2" aria-label="2 stars">★</label>
  <input class="tui-state-input tui-rating-input" type="radio" name="rating-stars" id="rating-stars-3" value="3" checked><label class="tui-rating-star" for="rating-stars-3" aria-label="3 stars">★</label>
  <input class="tui-state-input tui-rating-input" type="radio" name="rating-stars" id="rating-stars-4" value="4"><label class="tui-rating-star" for="rating-stars-4" aria-label="4 stars">★</label>
  <input class="tui-state-input tui-rating-input" type="radio" name="rating-stars" id="rating-stars-5" value="5"><label class="tui-rating-star" for="rating-stars-5" aria-label="5 stars">★</label>
</fieldset>
