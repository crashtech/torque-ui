<div class="tui-flex tui-flex-wrap tui-gap-6 tui-items-center">
  <fieldset class="tui-rating" style="--tui-rating-size: var(--tui-text-base); --tui-rating-gap: 0">
    <legend class="tui-sr-only">Compact rating</legend>
    <input class="tui-state-input tui-rating-input" type="radio" name="rating-sizes-sm" id="rating-sizes-sm-1" value="1"><label class="tui-rating-star" for="rating-sizes-sm-1" aria-label="1 star">★</label>
    <input class="tui-state-input tui-rating-input" type="radio" name="rating-sizes-sm" id="rating-sizes-sm-2" value="2"><label class="tui-rating-star" for="rating-sizes-sm-2" aria-label="2 stars">★</label>
    <input class="tui-state-input tui-rating-input" type="radio" name="rating-sizes-sm" id="rating-sizes-sm-3" value="3"><label class="tui-rating-star" for="rating-sizes-sm-3" aria-label="3 stars">★</label>
    <input class="tui-state-input tui-rating-input" type="radio" name="rating-sizes-sm" id="rating-sizes-sm-4" value="4" checked><label class="tui-rating-star" for="rating-sizes-sm-4" aria-label="4 stars">★</label>
    <input class="tui-state-input tui-rating-input" type="radio" name="rating-sizes-sm" id="rating-sizes-sm-5" value="5"><label class="tui-rating-star" for="rating-sizes-sm-5" aria-label="5 stars">★</label>
  </fieldset>
  <fieldset class="tui-rating" style="--tui-rating-size: var(--tui-text-4xl); --tui-rating-active: var(--tui-negative); --tui-rating-idle: var(--tui-surface-3)">
    <legend class="tui-sr-only">Hearts</legend>
    <input class="tui-state-input tui-rating-input" type="radio" name="rating-sizes-lg" id="rating-sizes-lg-1" value="1"><label class="tui-rating-star" for="rating-sizes-lg-1" aria-label="1 heart">♥</label>
    <input class="tui-state-input tui-rating-input" type="radio" name="rating-sizes-lg" id="rating-sizes-lg-2" value="2" checked><label class="tui-rating-star" for="rating-sizes-lg-2" aria-label="2 hearts">♥</label>
    <input class="tui-state-input tui-rating-input" type="radio" name="rating-sizes-lg" id="rating-sizes-lg-3" value="3"><label class="tui-rating-star" for="rating-sizes-lg-3" aria-label="3 hearts">♥</label>
  </fieldset>
</div>
