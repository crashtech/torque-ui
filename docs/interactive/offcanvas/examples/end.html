<div class="tui-p-4">
  <button class="tui-button" popovertarget="offcanvas-end-filters">Filters</button>
  <aside class="tui-offcanvas tui-offcanvas-end" id="offcanvas-end-filters" popover aria-labelledby="offcanvas-end-filters-title">
    <div class="tui-flex tui-justify-between tui-items-center tui-mb-4">
      <h3 class="tui-m-0" id="offcanvas-end-filters-title">Filters</h3>
      <button class="tui-close" popovertarget="offcanvas-end-filters" popovertargetaction="hide" aria-label="Close"></button>
    </div>
    <div class="tui-checkbox-group">
      <label class="tui-checkbox"><input class="tui-checkbox-input" type="checkbox" checked><span>In stock</span></label>
      <label class="tui-checkbox"><input class="tui-checkbox-input" type="checkbox"><span>On sale</span></label>
      <label class="tui-checkbox"><input class="tui-checkbox-input" type="checkbox"><span>Free shipping</span></label>
    </div>
  </aside>
</div>
