<div class="tui-speed-dial">
  <button class="tui-button tui-button-primary tui-fab" type="button" popovertarget="speed-dial-basic" aria-label="Create">+</button>
  <div class="tui-speed-dial-actions" id="speed-dial-basic" popover>
    <button class="tui-button tui-button-icon" type="button" aria-label="New note">N</button>
    <button class="tui-button tui-button-icon" type="button" aria-label="New task">T</button>
    <button class="tui-button tui-button-icon" type="button" aria-label="New event">E</button>
  </div>
</div>
