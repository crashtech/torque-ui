<span class="tui-cycle" role="radiogroup" aria-label="Sort">
  <input class="tui-state-input" type="radio" id="cycle-states-none" name="cycle-states" value="none" aria-label="Unsorted" checked>
  <label class="tui-button" for="cycle-states-asc">Sort: none</label>
  <input class="tui-state-input" type="radio" id="cycle-states-asc" name="cycle-states" value="asc" aria-label="A to Z">
  <label class="tui-button" for="cycle-states-desc">Sort: A–Z</label>
  <input class="tui-state-input" type="radio" id="cycle-states-desc" name="cycle-states" value="desc" aria-label="Z to A">
  <label class="tui-button" for="cycle-states-none">Sort: Z–A</label>
</span>
