<input class="tui-state-input tui-theme-toggle-input" type="checkbox" id="dark-mode-toggle-1">
<label class="tui-button tui-button-outline tui-m-3" for="dark-mode-toggle-1">
  <span class="tui-light-only">☾ Switch to dark</span>
  <span class="tui-dark-only">☼ Switch to light</span>
</label>
<div class="tui-page tui-bg-surface-0 tui-text-1 tui-p-3">
  <div class="tui-card tui-max-w-sm">
    <div class="tui-card-header"><h3>Inside .tui-page</h3></div>
    <div class="tui-card-body">
      <p>Checked inverts the OS scheme. The button and badge below re-resolve every token.</p>
      <div class="tui-flex tui-gap-2 tui-mt-3 tui-items-center">
        <button class="tui-button tui-button-primary">Primary</button>
        <span class="tui-badge tui-badge-info">Info</span>
      </div>
    </div>
  </div>
</div>
