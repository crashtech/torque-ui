<div class="tui-grid tui-grid-sm-2 tui-gap-4">
  <div class="tui-scheme-dark tui-bg-surface-0 tui-text-1 tui-p-4 tui-rounded-md">
    <strong>.tui-scheme-dark</strong>
    <p class="tui-text-2 tui-text-sm">Always dark, whatever the page is doing.</p>
    <span class="tui-badge tui-badge-warning">Warning</span>
  </div>
  <div class="tui-scheme-light tui-bg-surface-0 tui-text-1 tui-p-4 tui-rounded-md" style="border: 1px solid var(--tui-border)">
    <strong>.tui-scheme-light</strong>
    <p class="tui-text-2 tui-text-sm">Always light, even on a dark page.</p>
    <span class="tui-badge tui-badge-warning">Warning</span>
  </div>
</div>
