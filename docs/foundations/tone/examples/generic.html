<div class="tui-stack">

    <span class="tui-badge tui-tone-success">success</span>
    <span class="tui-badge tui-tone-error">error</span>
    <span class="tui-badge tui-tone-warning">warning</span>
    <span class="tui-badge tui-tone-info">info</span>
    <span class="tui-badge tui-tone-neutral">neutral</span>
  </div>
  <div class="tui-flex tui-flex-wrap tui-gap-2 tui-items-center">
    <span class="tui-badge tui-tone-red">red</span>
    <span class="tui-badge tui-tone-orange">orange</span>
    <span class="tui-badge tui-tone-yellow">yellow</span>

    <span class="tui-badge tui-tone-pink">pink</span>
