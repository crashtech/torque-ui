<div class="tui-stack tui-stack-sm">
  <div class="tui-grid tui-grid-auto tui-gap-2" style="--tui-grid-min: 6.5rem">
    <div class="tui-tone-red tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">red</div>
    <div class="tui-tone-orange tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">orange</div>
    <div class="tui-tone-yellow tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">yellow</div>
    <div class="tui-tone-olive tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">olive</div>
    <div class="tui-tone-green tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">green</div>
    <div class="tui-tone-teal tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">teal</div>
    <div class="tui-tone-blue tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">blue</div>
    <div class="tui-tone-violet tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">violet</div>
    <div class="tui-tone-purple tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">purple</div>
    <div class="tui-tone-pink tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">pink</div>
    <div class="tui-tone-brown tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">brown</div>
    <div class="tui-tone-grey tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">grey</div>
    <div class="tui-tone-black tui-p-3 tui-rounded-md tui-text-center" style="background: var(--tui-tone); color: var(--tui-tone-fg)">black</div>
  </div>
  <div class="tui-flex tui-flex-wrap tui-gap-2 tui-items-center">
    <span class="tui-badge tui-tone-purple">purple badge</span>
    <span class="tui-chip tui-tone-teal">teal chip</span>
    <button class="tui-button tui-tone-brown" type="button">brown button</button>
    <span class="tui-badge tui-badge-solid tui-tone-pink">solid pink</span>
  </div>
</div>
