<div class="tui-grid tui-grid-sm-3 tui-gap-4">
  <div class="tui-card tui-hoverable">
    <div class="tui-card-body"><strong>Fast</strong><p class="tui-text-sm tui-text-2">Default: 150ms, easing-out.</p></div>
  </div>
  <div class="tui-card tui-hoverable" style="--tui-duration-fast: var(--tui-duration-slower)">
    <div class="tui-card-body"><strong>Slower</strong><p class="tui-text-sm tui-text-2">Same lift, 500ms.</p></div>
  </div>
  <div class="tui-card tui-hoverable" style="--tui-duration-fast: var(--tui-duration-slower); --tui-easing-out: var(--tui-easing-in)">
    <div class="tui-card-body"><strong>Easing-in</strong><p class="tui-text-sm tui-text-2">500ms, accelerating instead.</p></div>
  </div>
</div>
