<div class="tui-flex tui-flex-wrap tui-gap-4">
  <div class="tui-toggle-group" role="group" aria-label="Formatting">
    <input class="tui-state-input tui-toggle-input" type="checkbox" id="state-inputs-toggle-bold" name="state-inputs-toggle-fmt" value="bold"><label class="tui-toggle" for="state-inputs-toggle-bold">Bold</label>
    <input class="tui-state-input tui-toggle-input" type="checkbox" id="state-inputs-toggle-italic" name="state-inputs-toggle-fmt" value="italic"><label class="tui-toggle" for="state-inputs-toggle-italic">Italic</label>
  </div>
  <div class="tui-toggle-group" role="radiogroup" aria-label="Alignment">
    <input class="tui-state-input tui-toggle-input" type="radio" id="state-inputs-toggle-left" name="state-inputs-toggle-align" value="left" checked><label class="tui-toggle" for="state-inputs-toggle-left">Left</label>
    <input class="tui-state-input tui-toggle-input" type="radio" id="state-inputs-toggle-center" name="state-inputs-toggle-align" value="center"><label class="tui-toggle" for="state-inputs-toggle-center">Center</label>
    <input class="tui-state-input tui-toggle-input" type="radio" id="state-inputs-toggle-right" name="state-inputs-toggle-align" value="right"><label class="tui-toggle" for="state-inputs-toggle-right">Right</label>
  </div>
</div>
