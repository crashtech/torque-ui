<div class="tui-grid tui-grid-sm-2 tui-grid-lg-4 tui-gap-6">
  <figure class="tui-m-0">
    <div class="tui-overflow-visible tui-bg-surface-1 tui-rounded-md" style="block-size: 7rem; border: 2px dashed var(--tui-border-strong)">
      <div class="tui-bg-primary-light tui-p-3 tui-rounded-md" style="inline-size: 130%; block-size: 9rem">A 130% wide, 9rem tall child.</div>
    </div>
    <figcaption class="tui-text-sm tui-text-2" style="margin-block-start: 3rem"><code>.tui-overflow-visible</code> - spills out of the dashed box</figcaption>
  </figure>
  <figure class="tui-m-0">
    <div class="tui-overflow-hidden tui-bg-surface-1 tui-rounded-md" style="block-size: 7rem; border: 2px dashed var(--tui-border-strong)">
      <div class="tui-bg-positive-light tui-p-3 tui-rounded-md" style="inline-size: 130%; block-size: 9rem">The same child, clipped at the box edge.</div>
    </div>
    <figcaption class="tui-text-sm tui-text-2" style="margin-block-start: 3rem"><code>.tui-overflow-hidden</code> - clipped, no scrollbars</figcaption>
  </figure>
  <figure class="tui-m-0">
    <div class="tui-overflow-auto tui-bg-surface-1 tui-rounded-md" style="block-size: 7rem; border: 2px dashed var(--tui-border-strong)">
      <div class="tui-bg-warning-light tui-p-3 tui-rounded-md" style="inline-size: 130%; block-size: 9rem">The same child, scrollable in both directions.</div>
    </div>
    <figcaption class="tui-text-sm tui-text-2" style="margin-block-start: 3rem"><code>.tui-overflow-auto</code> - scrollbars only when needed</figcaption>
  </figure>
  <figure class="tui-m-0">
    <div class="tui-overflow-scroll tui-bg-surface-1 tui-rounded-md" style="block-size: 7rem; border: 2px dashed var(--tui-border-strong)">
      <div class="tui-bg-info-light tui-p-3 tui-rounded-md" style="inline-size: 60%; block-size: 3rem">A small child.</div>
    </div>
    <figcaption class="tui-text-sm tui-text-2" style="margin-block-start: 3rem"><code>.tui-overflow-scroll</code> - scrollbars always, even with nothing to scroll</figcaption>
  </figure>
</div>
