<div class="tui-stack" style="--tui-duration-normal: 2s">
  <label class="tui-switch" for="animate-count-switch">
    <input class="tui-switch-input" type="checkbox" id="animate-count-switch">
    <span class="tui-switch-label">Count back down</span>
  </label>
  <span class="tui-badge tui-animate tui-animate-count tui-animate-count-text tui-animate-out tui-animate-when-checked" style="--tui-animate-to: 1250; animation-timing-function: var(--tui-easing-in-out)"></span>
  <div class="tui-progress tui-animate tui-animate-count tui-animate-out tui-animate-when-checked" style="--tui-animate-to: 72; --tui-progress-value: var(--tui-animate-value)">
    <div class="tui-progress-bar tui-motion-none"></div>
  </div>
</div>
