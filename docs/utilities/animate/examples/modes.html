<div class="tui-stack">
  <div class="tui-flex tui-flex-wrap tui-gap-2 tui-items-center">
    <span class="tui-badge tui-animate tui-animate-fly-bottom">Flew in on load</span>
    <span class="tui-badge tui-animate tui-animate-pulse tui-animate-loop">Pulsing on a loop</span>
    <span class="tui-badge tui-animate tui-animate-scale" style="--tui-duration-normal: 1s; animation-timing-function: var(--tui-easing-in-out)">Slower, eased both ways</span>
  </div>
  <label class="tui-switch" for="animate-modes-hide">
    <input class="tui-switch-input" type="checkbox" id="animate-modes-hide">
    <span class="tui-switch-label">Hide the card</span>
  </label>
  <div class="tui-card tui-p-4 tui-animate tui-animate-fade tui-animate-out tui-animate-when-checked">Fades out when the switch is on, and is back the moment it is off.</div>
</div>
