<div class="tui-stack">
  <label class="tui-card tui-p-4 tui-animate tui-animate-tada tui-animate-when-checked">
    <input class="tui-state-input" type="checkbox"> Check me: the card celebrates its own checkbox
  </label>
  <details class="tui-collapse">
    <summary class="tui-collapse-summary">Open me</summary>
    <div class="tui-collapse-body">
      <p class="tui-animate tui-animate-fly-bottom tui-animate-when-open">This paragraph flies in every time the details opens.</p>
    </div>
  </details>
  <div class="tui-field tui-animate tui-animate-shake tui-animate-when-invalid">
    <label for="animate-gated-email">Email (type a word that is not an address, then tab away)</label>
    <input id="animate-gated-email" type="email" required>
  </div>
</div>
