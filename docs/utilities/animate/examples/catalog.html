<script>
  const pause = 600;
  document.querySelectorAll('#animate-catalog [tabindex]').forEach((tile) => {
    const photo = tile.querySelector('.tui-animate');
    const playing = () => tile.hasAttribute('data-playing');
    tile.addEventListener('focusin', () => tile.setAttribute('data-playing', ''));
    tile.addEventListener('focusout', () => {
      tile.removeAttribute('data-playing');
      photo.classList.remove('tui-animate-out');
    });
    photo.addEventListener('animationend', () => setTimeout(() => {
      if (!playing()) return;
      photo.classList.toggle('tui-animate-out');
      photo.style.animationName = 'none';
      void photo.offsetWidth;
      photo.style.animationName = '';
    }, pause));
  });
</script>
