<div class="tui-stack">
  <div>
    <input class="tui-state-input" type="checkbox" id="animate-ripple-bounce">
    <label class="tui-button tui-button-primary tui-animate tui-animate-bounce tui-animate-when-checked" for="animate-ripple-bounce">The checkbox before me bounces me</label>
  </div>
  <div class="tui-field">
    <label for="animate-ripple-focus">Focus me</label>
    <input id="animate-ripple-focus" placeholder="The hint below flashes while I have focus">
    <span class="tui-help tui-animate tui-animate-flash tui-animate-loop tui-animate-when-focus">Flashing while the field before me is focused</span>
  </div>
  <div class="tui-card tui-p-4 tui-animate-host">
    <span class="tui-badge tui-animate tui-animate-jiggle tui-animate-loop tui-animate-when-hover">&#9733; jiggles</span> while any part of this host card is hovered
  </div>
</div>
